site_name: StateFun Actors by Kzmlabs
site_description: Stateful actors on Apache Flink — durable per-key state, exactly-once Kafka/Kinesis I/O, Kubernetes-native. Flink 2.2 + Java 21.
site_url: https://kzmlabs.github.io/flink-statefun/
repo_url: https://github.com/kzmlabs/flink-statefun
repo_name: kzmlabs/flink-statefun
edit_uri: edit/release/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-horizontal.png
  favicon: assets/favicon-32.png
  palette:
    # Light default — clean Inter + cyan accent on white.
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Switch to light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Install: install.md
      - Snapshot builds: snapshots.md
      - Building from source: build.md
  - Examples:
      - Overview: examples/index.md
      - Real-time fraud detection: examples/fraud-detection.md
      - IoT fleet digital twins: examples/iot-fleet.md
  - Guides:
      - Kafka I/O: guides/kafka-io.md
      - Kafka record headers: guides/kafka-headers.md
      - Kafka egress tuning: guides/kafka-egress-tuning.md
      - Kinesis I/O: guides/kinesis-io.md
      - Kubernetes deployment: guides/k8s-deployment.md
      - Logging: guides/logging.md
  - Architecture:
      - Overview: architecture/index.md
      - Shading layer: architecture/shading.md
      - End-to-end tests: architecture/e2e-tests.md
  - Decisions:
      - Decision records: adr/index.md
      - "0001: Fork for Flink 2.x": adr/0001-fork-statefun-for-flink-2.md
      - "0002: Kafka Source/Sink V2": adr/0002-kafka-io-source-sink-v2.md
      - "0003: Kinesis I/O + LocalStack": adr/0003-restore-kinesis-io-localstack.md
      - "0004: K8s E2E release gate": adr/0004-k8s-native-e2e-release-gate.md
      - "0005: Kafka record headers": adr/0005-kafka-record-headers.md
      - "0006: Operator 1.15, v2_2": adr/0006-operator-1-15-flink-v2-2.md
      - "0007: Restart-strategy keys": adr/0007-restart-strategy-key-names.md
      - "0008: Kafka invalid-record handling": adr/0008-kafka-invalid-record-handling.md
  - Articles:
      - Overview: articles/index.md
      - Kafka record headers in Stateful Functions: articles/kafka-record-headers.md
      - Upgrading to Flink Operator 1.15: articles/flink-operator-1.15-upgrade.md
      - We forked Apache Stateful Functions for Flink 2.x: articles/forking-statefun.md
  - Differences from Apache StateFun: upstream-vs-kzm.md
  - Release process: release-process.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kzmlabs/flink-statefun
    - icon: material/package-variant
      link: https://central.sonatype.com/artifact/io.github.kzmlabs.flinkstatefun/statefun-bom
      name: Maven Central

extra_css:
  - assets/css/theme.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/js/mermaid-init.js
