# Example FlinkDeployment CRD for the Flink Kubernetes Operator.
# Adjust image, resources, and configuration to match your environment.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: statefun-app
spec:
  image: ghcr.io/kzmlabs/flink-statefun:3.4.0-KZM-2.0-RC3-k8s
  flinkVersion: "v2_2"
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    state.backend.type: hashmap
    state.checkpoints.dir: file:///tmp/flink-checkpoints
    state.savepoints.dir: file:///tmp/flink-savepoints
    execution.checkpointing.interval: "60000"
    execution.checkpointing.mode: EXACTLY_ONCE
    # StateFun module configuration
    statefun.flink-job-name: statefun-app
  serviceAccount: flink
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "2048m"
      cpu: 1
  job:
    jarURI: local:///opt/flink/statefun.jar
    parallelism: 1
    upgradeMode: savepoint
