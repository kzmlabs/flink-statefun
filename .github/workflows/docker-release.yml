name: Docker Release Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for Docker image'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kzmlabs/flink-statefun

jobs:
  k8s-e2e:
    name: K8s E2E Gate
    uses: ./.github/workflows/e2e-test.yml

  docker:
    needs: k8s-e2e
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test (skip E2E)
        run: mvn clean install -B -Dtest="!UnixDomainSocketITCase" -DfailIfNoTests=false -pl '!:statefun-smoke-e2e-embedded,!:statefun-smoke-e2e-multilang-base,!:statefun-smoke-e2e-multilang-harness,!:statefun-smoke-e2e-java,!:statefun-smoke-e2e-golang,!:statefun-smoke-e2e-js,!:statefun-k8s-native-e2e'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: ./tools/docker/build-stateful-functions.sh ${{ github.event.inputs.version }}

      - name: Tag and push to GHCR
        run: |
          docker tag flink-statefun:${{ github.event.inputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
