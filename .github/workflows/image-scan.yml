# Builds the statefun-docker image and scans it with Trivy on every change that
# can alter image contents. Same gate config as release.yml / docker-release.yml
# (HIGH,CRITICAL + ignore-unfixed + exit-code 1), so a CVE that would block a
# release fails here first — on the PR, not on release day. The weekly cron
# re-scans the current release branch to catch newly disclosed CVEs.
name: Image CVE Scan

on:
  push:
    branches: [ release ]
    paths:
      - 'pom.xml'
      - 'statefun-docker/**'
      - 'statefun-flink/**'
      - 'statefun-shaded/**'
      - 'statefun-flink-runner/**'
      - 'statefun-kafka-io/**'
      - 'statefun-kinesis-io/**'
      - 'statefun-sdk-embedded/**'
      - '.github/workflows/image-scan.yml'
  pull_request:
    branches: [ release, master ]
    paths:
      - 'pom.xml'
      - 'statefun-docker/**'
      - 'statefun-flink/**'
      - 'statefun-shaded/**'
      - 'statefun-flink-runner/**'
      - 'statefun-kafka-io/**'
      - 'statefun-kinesis-io/**'
      - 'statefun-sdk-embedded/**'
      - '.github/workflows/image-scan.yml'
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # report_scan_failure.sh opens a tracking issue on cron failure

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Build image & Trivy scan
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Cron fires on the default branch; scan the release branch instead —
          # that is the branch images are released from.
          ref: ${{ github.event_name == 'schedule' && 'release' || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build image context
        run: mvn package -pl :statefun-docker -am -B -DskipTests

      - name: Build Docker image
        run: docker build -t statefun-scan:${{ github.sha }} statefun-docker/target/docker

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: statefun-scan:${{ github.sha }}
          format: table
          output: trivy-report.txt
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Surface the report on the run's Summary page — no log digging needed.
      - name: Publish report to run summary
        if: always()
        run: |
          [ -s trivy-report.txt ] || exit 0
          {
            echo '## Trivy image scan report'
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

      # Cron failures have no PR to surface them — open (or bump) a tracking
      # issue so the failure lands in email and stays visible until fixed.
      - name: Open tracking issue on scan failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report_scan_failure.sh
