name: K8s E2E Test

on:
  workflow_call:    # reusable by release workflows
  workflow_dispatch:
  pull_request:    # gate every PR that touches code; quickstart-only changes are covered by quickstart-smoke.yml
    paths-ignore:
      - 'examples/quickstart/**'
      - 'docs/quickstart.md'
      - '.github/workflows/quickstart-smoke.yml'
      - '.github/scripts/quickstart-smoke.sh'
  push:
    branches: [release, master]    # post-merge validation on protected branches
    paths-ignore:
      - 'examples/quickstart/**'
      - 'docs/quickstart.md'
      - '.github/workflows/quickstart-smoke.yml'
      - '.github/scripts/quickstart-smoke.sh'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default — this workflow only needs to fetch source and run tests.
permissions:
  contents: read

jobs:
  k8s-e2e:
    runs-on: ubuntu-latest
    name: K8s End-to-End Test
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build all modules (skip tests)
        run: mvn install -DskipTests -B

      - name: Run K8s E2E (build images, setup cluster, test)
        # Skip mvn's post-integration-test teardown so the explicit Teardown
        # step below is the only one that runs — otherwise the cluster is
        # gone before 'Collect logs on failure' can reach it.
        run: mvn verify -pl :statefun-e2e-k8s-native -am -B -Dskip.teardown=true

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Flink Operator logs ==="
          kubectl logs -n flink-operator -l app.kubernetes.io/name=flink-kubernetes-operator --tail=200 || true
          echo "=== FlinkDeployment status ==="
          kubectl get flinkdeployment -n statefun-e2e -o yaml || true
          echo "=== JobManager logs ==="
          kubectl logs -n statefun-e2e -l component=jobmanager --tail=200 || true
          echo "=== TaskManager logs ==="
          kubectl logs -n statefun-e2e -l component=taskmanager --tail=200 || true
          echo "=== Remote function logs ==="
          kubectl logs -n statefun-e2e -l app=remote-function --tail=200 || true
          echo "=== Kafka logs ==="
          kubectl logs -n statefun-e2e -l app=kafka --tail=100 || true
          echo "=== LocalStack logs ==="
          kubectl logs -n statefun-e2e -l app=localstack --tail=100 || true
          echo "=== Kinesis streams + S3 bucket ==="
          LOCALSTACK_POD=$(kubectl get pod -n statefun-e2e -l app=localstack -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$LOCALSTACK_POD" ]; then
            kubectl exec -n statefun-e2e "$LOCALSTACK_POD" -- awslocal kinesis list-streams || true
            kubectl exec -n statefun-e2e "$LOCALSTACK_POD" -- awslocal s3 ls || true
            kubectl exec -n statefun-e2e "$LOCALSTACK_POD" -- awslocal s3 ls s3://statefun-checkpoints/ --recursive || true
          fi
          echo "=== All pods ==="
          kubectl get pods -A || true
          echo "=== Events ==="
          kubectl get events -n statefun-e2e --sort-by='.lastTimestamp' || true

      - name: Teardown cluster
        if: always()
        run: bash statefun-e2e-tests/statefun-e2e-k8s-native/scripts/teardown-cluster.sh
