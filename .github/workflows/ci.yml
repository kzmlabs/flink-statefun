name: CI Build

on:
  push:
    branches: [ release, master ]
  pull_request:
    branches: [ release, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run all tests
        run: mvn clean install -B -Dtest="!UnixDomainSocketITCase"

      - name: Build Docker image
        run: ./tools/docker/build-stateful-functions.sh

      - name: Run E2E tests
        run: mvn verify -Prun-e2e-tests -B -pl statefun-e2e-tests
