name: Release to Maven Central & GHCR

# Trigger on:
#   v* tags          → full release (Maven Central + Docker + GitHub Release)
#   docker-*         → Docker-only release (build + push image, no Maven Central)
#   workflow_dispatch → manual release with chosen type and version
on:
  push:
    tags:
      - 'v*'
      - 'docker-*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - full
          - docker-only
      version:
        description: 'Version (e.g. 3.4.0-KZM-2.0-RC5)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kzmlabs/flink-statefun

jobs:
  k8s-e2e:
    name: K8s E2E Gate
    uses: ./.github/workflows/e2e-test.yml

  release:
    needs: k8s-e2e
    runs-on: ubuntu-latest
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine release type
        id: release_type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ github.event.inputs.release_type }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == v* ]]; then
              echo "type=full" >> $GITHUB_OUTPUT
              echo "version=${TAG#v}" >> $GITHUB_OUTPUT
            elif [[ "$TAG" == docker-* ]]; then
              echo "type=docker-only" >> $GITHUB_OUTPUT
              echo "version=${TAG#docker-}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Build and test
        run: mvn clean install -B

      - name: Deploy to Maven Central
        if: steps.release_type.outputs.type == 'full'
        run: |
          # Exclude e2e tests from deployment
          mvn deploy -Prelease -DskipTests -B \
            -pl '!:statefun-flink-runner,!:statefun-docker,!:statefun-e2e-tests,!:statefun-e2e-tests-common,!:statefun-smoke-e2e-common,!:statefun-smoke-e2e-driver,!:statefun-smoke-e2e-embedded,!:statefun-smoke-e2e-multilang-base,!:statefun-smoke-e2e-multilang-harness,!:statefun-smoke-e2e-java,!:statefun-smoke-e2e-golang,!:statefun-smoke-e2e-js,!:statefun-k8s-native-e2e'
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release_type.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.release_type.outputs.version, 'RC') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: statefun-docker/target/docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Attest image provenance (Sigstore keyless)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        if: steps.release_type.outputs.type == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_type.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release ${VERSION}" \
            --notes "$(cat <<EOF
          ## Kzmlabs StateFun ${VERSION}

          ### Maven Coordinates
          \`\`\`xml
          <dependency>
              <groupId>io.github.kzmlabs.flinkstatefun</groupId>
              <artifactId>statefun-sdk-java</artifactId>
              <version>${VERSION}</version>
          </dependency>
          \`\`\`

          ### Docker Image
          \`\`\`bash
          docker pull ghcr.io/kzmlabs/flink-statefun:${VERSION}
          \`\`\`

          ### Changes
          See [CHANGELOG](https://github.com/kzmlabs/flink-statefun/blob/release/CHANGELOG.md) for details.
          EOF
          )"
