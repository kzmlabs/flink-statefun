name: Release to Maven Central & GHCR

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kzmlabs/flink-statefun

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release to Maven Central & GHCR
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and test
        run: mvn clean verify -B -Dtest="!UnixDomainSocketITCase"

      - name: Deploy to Maven Central
        run: mvn deploy -Prelease -DskipTests -B
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Docker build and push to GitHub Container Registry
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker build context
        run: |
          # Find the built JARs
          DISTRIBUTION_JAR=$(find . -path "*/statefun-flink-distribution/target/statefun-flink-distribution*.jar" -not -name "original-*" -not -name "*sources*" -not -name "*javadoc*" | head -1)
          CORE_JAR=$(find . -path "*/statefun-flink-core/target/statefun-flink-core*.jar" -not -name "*javadoc*" -not -name "*sources*" | head -1)

          # Prepare Docker context
          mkdir -p docker-context/flink/lib
          cp -r tools/docker/flink-distribution-template/* docker-context/flink/
          cp "$DISTRIBUTION_JAR" docker-context/flink/lib/statefun-flink-distribution.jar
          cp "$CORE_JAR" docker-context/flink/lib/statefun-flink-core.jar
          cp tools/docker/Dockerfile docker-context/
          cp tools/docker/docker-entry-point.sh docker-context/

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Kzmlabs Flink StateFun
            org.opencontainers.image.description=Kzmlabs fork of Apache Flink Stateful Functions
            org.opencontainers.image.version=${{ steps.get_version.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Kzmlabs StateFun ${{ steps.get_version.outputs.VERSION }}

            ### Maven Coordinates
            ```xml
            <dependency>
                <groupId>io.github.kzmlabs</groupId>
                <artifactId>statefun-sdk-java</artifactId>
                <version>${{ steps.get_version.outputs.VERSION }}</version>
            </dependency>
            ```

            ### Docker Image
            ```bash
            docker pull ghcr.io/kzmlabs/flink-statefun:${{ steps.get_version.outputs.VERSION }}
            ```

            ### Changes
            See [CHANGELOG](https://github.com/kzmlabs/flink-statefun/blob/release/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
