name: Release to Maven Central & GHCR

# Trigger on:
#   v* tags          → full release (Maven Central + Docker + GitHub Release)
#   docker-*         → Docker-only release (build + push image, no Maven Central)
#   workflow_dispatch → manual release with chosen type and version
on:
  push:
    tags:
      - 'v*'
      - 'docker-*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - full
          - docker-only
      version:
        description: 'Version (e.g. 3.4.0-KZM-2.0-RC5)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only for GITHUB_TOKEN. The `release` job overrides with the writes it
# actually needs (contents:write for tag/release push, packages:write for GHCR, id-token +
# attestations for Sigstore signing).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kzmlabs/flink-statefun

jobs:
  k8s-e2e:
    name: K8s E2E Gate
    uses: ./.github/workflows/e2e-test.yml

  release:
    needs: k8s-e2e
    runs-on: ubuntu-latest
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine release type
        id: release_type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ github.event.inputs.release_type }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == v* ]]; then
              echo "type=full" >> $GITHUB_OUTPUT
              echo "version=${TAG#v}" >> $GITHUB_OUTPUT
            elif [[ "$TAG" == docker-* ]]; then
              echo "type=docker-only" >> $GITHUB_OUTPUT
              echo "version=${TAG#docker-}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Build and test
        run: mvn clean install -B

      - name: Deploy to Maven Central
        if: steps.release_type.outputs.type == 'full'
        run: |
          # Exclude e2e tests from deployment
          mvn deploy -Prelease -DskipTests -B \
            -pl '!:statefun-flink-runner,!:statefun-docker,!:statefun-e2e-tests,!:statefun-e2e-tests-common,!:statefun-smoke-e2e-common,!:statefun-smoke-e2e-driver,!:statefun-smoke-e2e-embedded,!:statefun-smoke-e2e-multilang-base,!:statefun-smoke-e2e-multilang-harness,!:statefun-smoke-e2e-java,!:statefun-smoke-e2e-golang,!:statefun-smoke-e2e-js,!:statefun-e2e-k8s-native,!:statefun-coverage-report,!:statefun-e2e-coverage-report'
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release_type.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.release_type.outputs.version, 'RC') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: statefun-docker/target/docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Attest image provenance (Sigstore keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Install cosign so we can sign a release manifest as a GitHub Release asset.
      # Real signing of JARs happens via maven-gpg-plugin (uploaded to Maven Central) and
      # of container images via actions/attest-build-provenance above. OpenSSF Scorecard's
      # Signed-Releases check ONLY scans GitHub Release assets for signature files, so we
      # also publish a cosign-signed manifest here that binds the release tag to the docker
      # digest. Bumps Scorecard Signed-Releases from -1 to ~10 without weakening the real
      # supply-chain signing already in place.
      - name: Install cosign
        if: steps.release_type.outputs.type == 'full'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate and sign release manifest
        if: steps.release_type.outputs.type == 'full'
        env:
          VERSION: ${{ steps.release_type.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > release-manifest.txt <<EOF
          Release: v${VERSION}
          Built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Source commit: ${GITHUB_SHA}
          Source ref:    ${GITHUB_REF}

          Docker image (immutable digest):
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}

          Docker tag (mutable):
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}

          Maven Central artifacts (groupId io.github.kzmlabs.flinkstatefun, version ${VERSION}):
            statefun-sdk-java
            statefun-sdk-embedded
            statefun-sdk-protos
            statefun-flink-distribution
            statefun-flink-runner

          Signature verification (this manifest):
            cosign verify-blob \\
              --bundle release-manifest.txt.sigstore.bundle \\
              --certificate-identity-regexp 'https://github.com/kzmlabs/flink-statefun/.github/workflows/release.yml@refs/tags/v.*' \\
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
              release-manifest.txt

          Container image attestation verification:
            gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} --owner kzmlabs

          Maven Central JAR signature verification:
            mvn dependency:copy -Dartifact=io.github.kzmlabs.flinkstatefun:statefun-sdk-java:${VERSION}:jar.asc
            gpg --verify statefun-sdk-java-${VERSION}.jar.asc statefun-sdk-java-${VERSION}.jar
          EOF

          cosign sign-blob --yes \
            --bundle release-manifest.txt.sigstore.bundle \
            release-manifest.txt

      - name: Create GitHub Release
        if: steps.release_type.outputs.type == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_type.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release ${VERSION}" \
            --notes "$(cat <<EOF
          ## Kzmlabs StateFun ${VERSION}

          ### Maven Coordinates
          \`\`\`xml
          <dependency>
              <groupId>io.github.kzmlabs.flinkstatefun</groupId>
              <artifactId>statefun-sdk-java</artifactId>
              <version>${VERSION}</version>
          </dependency>
          \`\`\`

          ### Docker Image
          \`\`\`bash
          docker pull ghcr.io/kzmlabs/flink-statefun:${VERSION}
          \`\`\`

          ### Supply-chain signatures
          Attached \`release-manifest.txt.sigstore.bundle\` is a cosign-signed (Sigstore keyless) bundle binding this tag to the docker digest. Verification commands are inside \`release-manifest.txt\`.
          - Container image: signed via Sigstore keyless attestation, verifiable with \`gh attestation verify\`.
          - Maven Central JARs: GPG-signed, \`.asc\` files alongside each JAR on Maven Central.

          ### Changes
          See [CHANGELOG](https://github.com/kzmlabs/flink-statefun/blob/release/CHANGELOG.md) for details.
          EOF
          )" \
            release-manifest.txt \
            release-manifest.txt.sigstore.bundle
