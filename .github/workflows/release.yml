name: Release to Maven Central & GHCR

# Trigger on:
#   v* tags   → full release (Maven Central + Docker + GitHub Release)
#   docker-*  → Docker-only release (build + push image, no Maven Central)
on:
  push:
    tags:
      - 'v*'
      - 'docker-*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kzmlabs/flink-statefun

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release type
        id: release_type
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == v* ]]; then
            echo "type=full" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == docker-* ]]; then
            echo "type=docker-only" >> $GITHUB_OUTPUT
            echo "version=${TAG#docker-}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Build
        run: mvn clean install -DskipTests -B

      - name: Deploy to Maven Central
        if: steps.release_type.outputs.type == 'full'
        run: |
          # Exclude e2e tests and non-Java SDKs from deployment
          mvn deploy -Prelease -DskipTests -B \
            -pl '!:statefun-flink-runner,!:statefun-e2e-tests,!:statefun-e2e-tests-common,!:statefun-smoke-e2e-common,!:statefun-smoke-e2e-driver,!:statefun-smoke-e2e-embedded,!:statefun-smoke-e2e-multilang-base,!:statefun-smoke-e2e-multilang-harness,!:statefun-smoke-e2e-java,!:statefun-smoke-e2e-golang,!:statefun-smoke-e2e-js,!:statefun-sdk-python,!:statefun-sdk-go,!:statefun-sdk-js'
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker build context
        run: |
          UBER_JAR=$(find . -path "*/statefun-flink-runner/target/statefun-flink-runner*.jar" -not -name "original-*" -not -name "*sources*" -not -name "*javadoc*" | head -1)
          CORE_JAR=$(find . -path "*/statefun-flink-core/target/statefun-flink-core*.jar" -not -name "*javadoc*" -not -name "*sources*" | head -1)
          DIST_JAR=$(find . -path "*/statefun-flink-distribution/target/statefun-flink-distribution*.jar" -not -name "original-*" -not -name "*sources*" -not -name "*javadoc*" | head -1)

          mkdir -p docker-context/flink/lib
          cp "$CORE_JAR" docker-context/flink/lib/statefun-flink-core.jar
          cp "$DIST_JAR" docker-context/flink/lib/statefun-flink-distribution.jar
          cp "$UBER_JAR" docker-context/statefun.jar
          cp tools/docker/Dockerfile docker-context/

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release_type.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Kzmlabs Flink StateFun
            org.opencontainers.image.description=Kzmlabs fork of Apache Flink Stateful Functions
            org.opencontainers.image.version=${{ steps.release_type.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Create GitHub Release
        if: steps.release_type.outputs.type == 'full'
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.release_type.outputs.version }}
          body: |
            ## Kzmlabs StateFun ${{ steps.release_type.outputs.version }}

            ### Maven Coordinates
            ```xml
            <dependency>
                <groupId>io.github.kzmlabs.flinkstatefun</groupId>
                <artifactId>statefun-sdk-java</artifactId>
                <version>${{ steps.release_type.outputs.version }}</version>
            </dependency>
            ```

            ### Docker Image
            ```bash
            docker pull ghcr.io/kzmlabs/flink-statefun:${{ steps.release_type.outputs.version }}
            ```

            ### Changes
            See [CHANGELOG](https://github.com/kzmlabs/flink-statefun/blob/release/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
