#
# Dependabot config — keeps SHA-pinned GitHub Actions and Maven deps
# current. The actions in .github/workflows/ are pinned to commit hashes
# (per OpenSSF Scorecard supply-chain hardening). Dependabot watches for
# new tag releases and opens PRs that bump the SHA in step with the tag.

version: 2

updates:
  # Pinned GitHub Actions across all workflows.
  #
  # Grouping reduces noise for patch/minor bumps — they land as one weekly
  # PR. Major bumps each get their own PR (Dependabot's default once the
  # group's update-types excludes major) so the workflow API changes that
  # often come with vN -> vN+1 can be reviewed one upgrade at a time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maven dependency graph (root pom + all modules).
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # slf4j-log4j12 was renamed to slf4j-reload4j in slf4j 2.x and
      # pulls slf4j-api 2.x transitively. Flink 2.2.0 still drags slf4j-api
      # 1.7.36, so the bump trips Maven enforcer's DependencyConvergence.
      # The shared <slf4j-log4j12.version> property pins BOTH slf4j-api
      # and slf4j-log4j12, so both must be ignored — Dependabot opens the
      # PR keyed on whichever artifact it sees first. See PR #221 for the
      # failure mode; slf4j 2.x migration is tracked as a coordinated
      # change gated on upstream Flink.
      - dependency-name: "org.slf4j:slf4j-log4j12"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.slf4j:slf4j-api"
        update-types: ["version-update:semver-major"]

  # Docs site requirements (MkDocs Material + plugins).
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly

  # Go SDK module graph. SDK is otherwise out-of-scope for active work,
  # but security/CVE bumps still apply.
  - package-ecosystem: gomod
    directory: /statefun-sdk-go/v3
    schedule:
      interval: weekly

  # Base image digest for the published statefun-docker image.
  - package-ecosystem: docker
    directory: /statefun-docker/src/main/docker
    schedule:
      interval: weekly
