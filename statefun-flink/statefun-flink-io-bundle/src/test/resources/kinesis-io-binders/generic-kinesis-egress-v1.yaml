kind: io.statefun.kinesis.v1/egress
spec:
  id: com.foo.bar/test-egress
  streamName: test-stream
  awsRegion:
    type: specific
    id: us-west-2
  awsCredentials:
    type: basic
    accessKeyId: my_access_key_id
    secretAccessKey: my_secret_access_key
  maxOutstandingRecords: 9999
  clientConfigProperties:
    - SocketTimeout: 9999
    - MaxConnections: 15
