# Flink 2.x ARN path: streamArn set + exactly one routing entry under streams[].
# Binder re-keys the routing map under the ARN so runtime lookups by
# IngressRecord#getStream() (which the connector populates with the ARN) match.
kind: io.statefun.kinesis.v1/ingress
spec:
  id: com.foo.bar/arn-ingress
  awsRegion:
    type: specific
    id: us-east-1
  awsCredentials:
    type: basic
    accessKeyId: my_access_key_id
    secretAccessKey: my_secret_access_key
  startupPosition:
    type: latest
  streamArn: arn:aws:kinesis:us-east-1:000000000000:stream/events
  streams:
    - stream: events
      valueType: com.googleapis/com.mycomp.foo.MessageA
      targets:
        - com.mycomp.foo/function-1
