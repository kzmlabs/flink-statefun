kind: io.statefun.endpoints.v2/http
spec:
  functions: com.foo.bar/*
  urlPathTemplate: http://bar.foo.com:8080/functions/{function.name}
  maxNumBatchRequests: 10000
  transport:
    type: io.statefun.transports.v1/okhttp
    timeouts:
      call: 1minute
      connect: 30seconds
      read: 20seconds
      write: 10seconds