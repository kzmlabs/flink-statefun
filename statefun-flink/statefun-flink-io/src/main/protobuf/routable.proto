syntax = "proto3";

package org.apache.flink.statefun.flink.io;
option java_package = "org.apache.flink.statefun.flink.io.generated";
option java_multiple_files = true;

message AutoRoutable {
    RoutingConfig config = 1;
    string id = 2;
    bytes payload_bytes = 3;
    // Transport-level headers of the ingested record (e.g. Kafka record headers).
    // Duplicate keys are allowed and order is preserved.
    repeated Header headers = 4;
}

message Header {
    string key = 1;
    bytes value = 2;
    // has_value=false means the ingested transport header had a null value
    // (legal in Kafka), as opposed to an explicitly empty one.
    bool has_value = 3;
}

message RoutingConfig {
    string typeUrl = 1;
    repeated TargetFunctionType targetFunctionTypes = 2;
}

message TargetFunctionType {
    string namespace = 1;
    string type = 2;
}
