syntax = "proto3";

package org.apache.flink.statefun.flink.common;
option java_package = "org.apache.flink.statefun.flink.common.generated";
option java_multiple_files = true;

import "google/protobuf/descriptor.proto";

message ProtobufSerializerSnapshot {
    string generated_java_name = 1;
    string message_name = 2;

    google.protobuf.FileDescriptorSet descriptor_set = 3;
}

