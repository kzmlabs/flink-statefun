# StateFun configuration for Flink 2.x

statefun:
  flink-job-name: Statefun Application
  remote:
    module-name: file:///opt/statefun/modules/module.yaml

#==============================================================================
# Configurations strictly required by Stateful Functions. Do not change.
#==============================================================================

classloader:
  parent-first-patterns:
    additional:
      - org.apache.flink.statefun
      - org.apache.kafka
      - com.google.protobuf

#==============================================================================
# Fault tolerance, checkpointing and recovery.
#==============================================================================

# Uncomment the below to enable checkpointing for your application
#execution:
#  checkpointing:
#    mode: EXACTLY_ONCE
#    interval: 5sec

restart-strategy:
  type: fixed-delay
  fixed-delay:
    attempts: 2147483647
    delay: 1sec

state:
  backend:
    local-recovery: true
    type: rocksdb
    rocksdb:
      timer-service:
        factory: ROCKSDB
      localdir: /local/state/rocksdb
      memory:
        partitioned-index-filters: true
      checkpoint:
        transfer:
          thread:
            num: 8
      thread:
        num: 4
    incremental: true
  checkpoints:
    dir: file:///checkpoint-dir

taskmanager:
  state:
    local:
      root-dirs: file:///local/state/recovery
  memory:
    process:
      size: 4g
  bind-host: 0.0.0.0
  numberOfTaskSlots: 1

jobmanager:
  memory:
    process:
      size: 1g
  bind-host: 0.0.0.0
  rpc:
    address: localhost
    port: 6123
  execution:
    failover-strategy: region

parallelism:
  default: 1

rest:
  address: 0.0.0.0

#==============================================================================
# Support easy upgrades as the module.yaml file updates
#==============================================================================

pipeline:
  auto-generate-uids: false

execution:
  savepoint:
    ignore-unclaimed-state: true

env:
  java:
    opts:
      all: --add-exports=java.rmi/sun.rmi.registry=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED
