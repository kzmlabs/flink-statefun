apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-function
  namespace: statefun-e2e
  labels:
    app: remote-function
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remote-function
  template:
    metadata:
      labels:
        app: remote-function
    spec:
      containers:
        - name: remote-function
          image: statefun-remote-function:e2e
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /statefun
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: remote-function
  namespace: statefun-e2e
spec:
  selector:
    app: remote-function
  ports:
    - name: http
      port: 8080
      targetPort: 8080
