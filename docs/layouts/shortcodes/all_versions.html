{{/*
    Generate a list of links to all previous
    versions of the Flink docs.
*/}}
<ul class="book-languages-list">
    {{ range $docs := .Site.Params.PreviousDocs }}
        <li>
            <a href="{{ index $docs 1 }}">
                v{{ index $docs 0}}
            </a>
        </li>
    {{ end }}
</ul>
