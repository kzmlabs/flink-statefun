<!--
    Partial that on the footer of every page.
-->
{{ if .IsPage }}
{{ $folder := "content" }}
{{ if eq "/zh" .Site.LanguagePrefix }}
	{{ $folder = "content.zh" }}
{{ end }}
<a href="{{ .Site.Params.Repo }}/edit/{{ .Site.Params.Branch }}/docs/{{ $folder }}/{{ .File.Path }}" style="color:black"><i class="fa fa-edit fa-fw"></i>Edit This Page</a>
{{ end }}
