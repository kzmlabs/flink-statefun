apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: statefun-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.1
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: kinesis,s3
            - name: DEFAULT_REGION
              value: us-east-1
            - name: DEBUG
              value: "0"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: statefun-e2e
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
