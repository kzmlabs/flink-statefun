apiVersion: v1
kind: ConfigMap
metadata:
  name: statefun-e2e-module
  namespace: statefun-e2e
data:
  module.yaml: |
    ---
    kind: io.statefun.endpoints.v2/http
    spec:
      functions: e2e.k8s/*
      urlPathTemplate: http://remote-function.statefun-e2e:8080/statefun
      transport:
        type: io.statefun.transports.v1/async
        timeouts:
          call: 30sec
          connect: 10sec
    ---
    kind: io.statefun.kafka.v1/ingress
    spec:
      id: e2e/commands-proto
      address: kafka.statefun-e2e:9092
      consumerGroupId: statefun-e2e
      startupPosition:
        type: earliest
      topics:
        - topic: commands-proto
          valueType: io.github.kzmlabs.statefun.e2e/CounterCommand
          targets:
            - e2e.k8s/counter
    ---
    kind: io.statefun.kafka.v1/ingress
    spec:
      id: e2e/commands-json
      address: kafka.statefun-e2e:9092
      consumerGroupId: statefun-e2e
      startupPosition:
        type: earliest
      topics:
        - topic: commands-json
          valueType: e2e.k8s/json-string
          targets:
            - e2e.k8s/greeter
    ---
    kind: io.statefun.kafka.v1/egress
    spec:
      id: e2e/results
      address: kafka.statefun-e2e:9092
      deliverySemantic:
        type: at-least-once
