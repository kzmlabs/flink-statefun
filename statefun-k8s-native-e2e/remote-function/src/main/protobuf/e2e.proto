syntax = "proto3";

package e2e;

option java_package = "org.apache.flink.statefun.e2e.k8s.generated";
option java_outer_classname = "E2EProtos";
option java_multiple_files = false;

message CounterCommand {
    string id = 1;
    int64 delta = 2;
}

message CounterResult {
    string id = 1;
    int64 total = 2;
}
